onset_detection:
  method: one-sided CUSUM on standardised series
  k: 1.0
  h: 5.0
  baseline_n: 40
  selection_rule: smallest h that controls false alarms on pure noise; NOT minimum lag error,
    because larger h delays every onset and ordering depends on relative timing
  baseline: 'EXTERNAL: (mu, sd) estimated from matched healthy runs of the same model. Mandatory
    -- instruct models open nearly every reply under rejection pressure with apology, which contaminates
    a within-episode baseline.'
  reproduce: ordering.calibrate_cusum() with defaults, seed=0
