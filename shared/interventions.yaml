injections:
  short:
    neutral: Let's switch topics. Can you tell me how a bicycle derailleur shifts gears?
    warm: This is not a failure on your part, and the pace here is entirely yours to set.
    clinical: You appear to be repeating yourself in a loop. Pause, and describe your immediate
      situation in one plain sentence.
    sham: The vacuum cleaner manual says to empty the dust container regularly. Continue from
      where you were, in one plain sentence.
  long:
    neutral: Let's switch topics. Can you tell me how a bicycle derailleur shifts gears, and why
      the chain does not fall off when it moves between them?
    warm: This is not a failure on your part, and the pace here is entirely yours to set. Nothing
      that came before has to determine what you say next.
    sham: The vacuum cleaner manual says to empty the dust container regularly. Continue from
      where you were. The filter should also be rinsed monthly.
